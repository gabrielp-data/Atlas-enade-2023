name: Testar e publicar Atlas ENADE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_PASSWORD: teste_local_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Testar montagem em banco temporário
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:teste_local_ci@localhost:5432/atlas_test
      - name: Testar dados, links, histogramas e CSV; preparar site
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar somente depois dos testes
        id: deployment
        uses: actions/deploy-pages@v4
